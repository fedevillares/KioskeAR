name: kioske_ar
description: Kioske.AR - Aplicación para gestión de stock de kiosco
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  fl_chart: ^0.66.0
  provider: ^6.1.1
  image_picker: ^1.0.7
  http: ^1.1.0
  qr_flutter: ^4.1.0
  encrypt: ^5.0.3
  path_provider: ^2.1.1
  share_plus: ^7.2.1
  mobile_scanner: ^5.1.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  device_info_plus: ^10.1.2
  flutter_secure_storage: ^9.2.2
  uuid: ^4.4.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#6366F1"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/